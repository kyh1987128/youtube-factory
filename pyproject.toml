[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-factory"
version = "0.1.0"
description = "AI 기반 유튜브 콘텐츠 자동 생산 파이프라인"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=6.1.0",
    "Pillow>=10.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
]

[project.scripts]
ytfactory = "youtube_factory.cli:main"
