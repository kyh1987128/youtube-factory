[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "youtube-factory"
version = "0.1.0"
description = "AI 기반 유튜브 콘텐츠 자동 생산 파이프라인"
requires-python = ">=3.11"
dependencies = [
    # anthropic SDK 제거 - Claude Code CLI(Max 요금제)로 대체
    "edge-tts>=6.1.0",
    "Pillow>=10.0.0",
    # moviepy 제거 - Remotion으로 영상 렌더링
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pytrends>=4.9.0",
    "praw>=7.7.0",
    "requests>=2.31.0",
    "google-genai>=1.0.0",
]

[project.scripts]
ytfactory = "youtube_factory.cli:main"
